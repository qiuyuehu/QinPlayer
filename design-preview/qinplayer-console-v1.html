<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>QinPlayer — 视觉重设样张 v1</title>
  <style>
    /* ============================================================
       设计变量（与 PLAN-visual-reset.md 同名）
       ============================================================ */
    :root {
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    [data-theme="light"] {
      --bg-primary: #f3f1ec;
      --bg-secondary: #e9e6df;
      --bg-tertiary: #ddd8cf;
      --bg-card: #fbfaf7;
      --text-primary: #2b2925;
      --text-secondary: #716d66;
      --text-muted: #9b948a;
      --accent: #a86f2a;
      --accent-hover: #9b6a2f;
      --accent-subtle: rgba(168, 111, 42, 0.1);
      --control-hover: #e5e0d6;
      --control-active: #dbd5ca;
      --border: #d4cec3;
      --border-subtle: #e0dbd2;
      --player-bg: #e2ddd5;
      --titlebar-bg: #e9e6df;
      --progress-track: #c8c2b6;
      --progress-fill: #a86f2a;
      --player-btn-bg: #3d3a35;
      --player-btn-color: #f3f1ec;
      --input-bg: #eae6de;
      --input-border: #d4cec3;
      --scrollbar-thumb: #c8c2b6;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
      --focus-ring: 0 0 0 2px rgba(168, 111, 42, 0.3);
    }

    [data-theme="dark"] {
      --bg-primary: #141312;
      --bg-secondary: #1f1d1a;
      --bg-tertiary: #2a2723;
      --bg-card: #191817;
      --text-primary: #ded8ce;
      --text-secondary: #9b948a;
      --text-muted: #6b6560;
      --accent: #c0914f;
      --accent-hover: #b08345;
      --accent-subtle: rgba(192, 145, 79, 0.1);
      --control-hover: #2a2723;
      --control-active: #33302b;
      --border: #2f2b26;
      --border-subtle: #252220;
      --player-bg: #1f1d1a;
      --titlebar-bg: #1f1d1a;
      --progress-track: #2f2b26;
      --progress-fill: #c0914f;
      --player-btn-bg: #ded8ce;
      --player-btn-color: #141312;
      --input-bg: #2a2723;
      --input-border: #3a3630;
      --scrollbar-thumb: #3a3630;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.3);
      --focus-ring: 0 0 0 2px rgba(192, 145, 79, 0.3);
    }

    /* ============================================================
       全局重置
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-primary);
      width: 1000px;
      height: 680px;
      overflow: hidden;
    }

    /* ============================================================
       布局
       ============================================================ */
    .app {
      display: flex;
      flex-direction: column;
      height: 680px;
    }

    .app__body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ============================================================
       标题栏
       ============================================================ */
    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--border);
    }

    .titlebar__title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .titlebar__controls {
      display: flex;
      gap: 2px;
    }

    .title-bar__btn {
      width: 32px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: var(--radius-sm);
    }

    .title-bar__btn:hover {
      background: var(--control-hover);
    }

    .title-bar__btn--close:hover {
      background: #c42b1c;
      color: #fff;
    }

    /* ============================================================
       侧栏
       ============================================================ */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }

    .sidebar__search {
      padding: 0 12px 12px;
    }

    .sidebar__search-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--text-primary);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      outline: none;
    }

    .sidebar__search-input::placeholder {
      color: var(--text-muted);
    }

    .sidebar__search-input:focus {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    .sidebar__nav {
      flex: 1;
    }

    .sidebar__item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      position: relative;
      color: var(--text-secondary);
      transition: background-color 0.15s;
    }

    .sidebar__item:hover {
      background: var(--control-hover);
    }

    .sidebar__item--active {
      background: var(--control-active);
      color: var(--text-primary);
    }

    .sidebar__item--active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .sidebar__item--active .sidebar__icon {
      color: var(--accent);
    }

    .sidebar__icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar__label {
      font-size: 13px;
    }

    /* ============================================================
       主内容区
       ============================================================ */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      overflow: hidden;
    }

    .content__header {
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .content__count {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .content__actions {
      display: flex;
      gap: 8px;
    }

    .content__btn {
      padding: 6px 12px;
      font-size: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-primary);
    }

    .content__btn:hover {
      background: var(--control-hover);
    }

    /* ============================================================
       歌曲列表（无边框全出血）
       ============================================================ */
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .song-list__header {
      display: flex;
      align-items: center;
      padding: 8px 24px;
      background: var(--bg-secondary);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .song-list__col {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 4px;
    }

    .song-list__col--index {
      width: 40px;
      flex-shrink: 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .song-list__col--title {
      flex: 1;
      min-width: 0;
    }

    .song-list__col--artist {
      width: 160px;
      flex-shrink: 0;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .song-list__col--album {
      width: 140px;
      flex-shrink: 0;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .song-list__col--duration {
      width: 60px;
      flex-shrink: 0;
      text-align: right;
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin-left: 12px;
    }

    .song-list__row {
      display: flex;
      align-items: center;
      padding: 8px 24px;
      height: 44px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .song-list__row:hover {
      background: var(--control-hover);
    }

    .song-list__row--active {
      background: var(--accent-subtle);
    }

    .song-list__row--active .song-list__col--title {
      color: var(--accent);
      font-weight: 500;
    }

    .song-list__row--active .song-list__col--index {
      color: var(--accent);
    }

    .song-list__cell {
      font-size: 13px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song-list__cell--index {
      width: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .song-list__cell--title {
      flex: 1;
      min-width: 0;
    }

    .song-list__cell--artist {
      width: 160px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .song-list__cell--album {
      width: 140px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .song-list__cell--duration {
      width: 60px;
      text-align: right;
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin-left: 12px;
    }

    /* ============================================================
       底部播放器
       ============================================================ */
    .player-bar {
      height: 72px;
      flex-shrink: 0;
      background: var(--player-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
    }

    .player-bar__info {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 200px;
      flex-shrink: 0;
    }

    .player-bar__cover {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .player-bar__meta {
      overflow: hidden;
    }

    .player-bar__title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-bar__artist {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .player-bar__controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .player-bar__buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .player-bar__btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .player-bar__btn:hover {
      background: var(--control-hover);
    }

    .player-bar__play-btn {
      width: 42px;
      height: 42px;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
    }

    .player-bar__play-btn:hover {
      opacity: 0.9;
    }

    .player-bar__progress {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 400px;
    }

    .player-bar__time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      width: 36px;
      text-align: center;
    }

    .player-bar__progress-bar {
      flex: 1;
      height: 4px;
      background: var(--progress-track);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .player-bar__progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 45%;
      background: var(--progress-fill);
      border-radius: 2px;
    }

    .player-bar__right {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 160px;
      justify-content: flex-end;
    }

    .player-bar__volume {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-bar__volume-bar {
      width: 80px;
      height: 4px;
      background: var(--progress-track);
      border-radius: 2px;
      position: relative;
    }

    .player-bar__volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 65%;
      background: var(--progress-fill);
      border-radius: 2px;
    }

    /* ============================================================
       切换面板
       ============================================================ */
    .switcher {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .switcher__group {
      display: flex;
      gap: 4px;
    }

    .switcher__btn {
      padding: 6px 12px;
      font-size: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-primary);
    }

    .switcher__btn:hover {
      background: var(--control-hover);
    }

    .switcher__btn--active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .switcher__label {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ============================================================
       滚动条
       ============================================================ */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 3px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <!-- 标题栏 -->
    <div class="titlebar">
      <span class="titlebar__title">QinPlayer</span>
      <div class="titlebar__controls">
        <button class="title-bar__btn">─</button>
        <button class="title-bar__btn">□</button>
        <button class="title-bar__btn title-bar__btn--close">×</button>
      </div>
    </div>

    <div class="app__body">
      <!-- 侧栏 -->
      <div class="sidebar">
        <div class="sidebar__search">
          <input class="sidebar__search-input" type="text" placeholder="搜索歌曲...">
        </div>
        <div class="sidebar__nav">
          <div class="sidebar__item sidebar__item--active">
            <span class="sidebar__icon">🕐</span>
            <span class="sidebar__label">最近播放</span>
          </div>
          <div class="sidebar__item">
            <span class="sidebar__icon">♫</span>
            <span class="sidebar__label">本地音乐</span>
          </div>
          <div class="sidebar__item">
            <span class="sidebar__icon">💿</span>
            <span class="sidebar__label">专辑</span>
          </div>
          <div class="sidebar__item">
            <span class="sidebar__icon">📋</span>
            <span class="sidebar__label">歌单</span>
          </div>
          <div class="sidebar__item">
            <span class="sidebar__icon">⭐</span>
            <span class="sidebar__label">我喜欢的</span>
          </div>
          <div class="sidebar__item">
            <span class="sidebar__icon">⚙</span>
            <span class="sidebar__label">设置</span>
          </div>
        </div>
      </div>

      <!-- 主内容区 -->
      <div class="content">
        <div class="content__header">
          <div>
            <span class="content__title" id="pageTitle">最近播放</span>
            <span class="content__count" id="pageCount">20 首</span>
          </div>
          <div class="content__actions" id="pageActions">
            <!-- 状态A无按钮，状态B有选择文件夹按钮 -->
          </div>
        </div>

        <!-- 歌曲列表 -->
        <div class="song-list" id="songList">
          <!-- 表头 -->
          <div class="song-list__header">
            <span class="song-list__col song-list__col--index">#</span>
            <span class="song-list__col song-list__col--title">歌名</span>
            <span class="song-list__col song-list__col--artist">歌手</span>
            <span class="song-list__col song-list__col--album" id="albumHeader" style="display: none;">专辑</span>
            <span class="song-list__col song-list__col--duration">时长</span>
          </div>

          <!-- 歌曲行（由JS动态生成） -->
          <div id="songRows"></div>
        </div>
      </div>
    </div>

    <!-- 底部播放器 -->
    <div class="player-bar">
      <div class="player-bar__info">
        <div class="player-bar__cover">♫</div>
        <div class="player-bar__meta">
          <div class="player-bar__title">Fallen Petals</div>
          <div class="player-bar__artist">Fleet Snowfluff</div>
        </div>
      </div>

      <div class="player-bar__controls">
        <div class="player-bar__buttons">
          <button class="player-bar__btn">⏮</button>
          <button class="player-bar__btn player-bar__play-btn">▶</button>
          <button class="player-bar__btn">⏭</button>
        </div>
        <div class="player-bar__progress">
          <span class="player-bar__time">1:12</span>
          <div class="player-bar__progress-bar">
            <div class="player-bar__progress-fill"></div>
          </div>
          <span class="player-bar__time">2:32</span>
        </div>
      </div>

      <div class="player-bar__right">
        <div class="player-bar__volume">
          <span style="font-size: 14px; color: var(--text-muted);">🔊</span>
          <div class="player-bar__volume-bar">
            <div class="player-bar__volume-fill"></div>
          </div>
        </div>
        <button class="player-bar__btn" style="font-size: 12px;">≡</button>
      </div>
    </div>
  </div>

  <!-- 切换面板 -->
  <div class="switcher">
    <div class="switcher__label">主题</div>
    <div class="switcher__group">
      <button class="switcher__btn switcher__btn--active" data-theme="light">浅色</button>
      <button class="switcher__btn" data-theme="dark">暗色</button>
    </div>
    <div class="switcher__label" style="margin-top: 8px;">列表状态</div>
    <div class="switcher__group">
      <button class="switcher__btn switcher__btn--active" data-state="A">A: 无专辑列</button>
      <button class="switcher__btn" data-state="B">B: 有专辑列</button>
    </div>
  </div>

    // 渲染歌曲行
    function renderSongs(songs, showAlbum) {
      const songRows = document.getElementById('songRows');
      const albumHeader = document.getElementById('albumHeader');
      
      // 显示/隐藏专辑列头
      albumHeader.style.display = showAlbum ? 'block' : 'none';
      
      // 生成歌曲行
      let html = '';
      songs.forEach(song => {
        const activeClass = song.active ? ' song-list__row--active' : '';
        html += `<div class="song-list__row${activeClass}">`;
        html += `<span class="song-list__cell song-list__cell--index">${song.index}</span>`;
        html += `<span class="song-list__cell song-list__cell--title">${song.title}</span>`;
        html += `<span class="song-list__cell song-list__cell--artist">${song.artist}</span>`;
        if (showAlbum) {
          html += `<span class="song-list__cell song-list__cell--album">${song.album}</span>`;
        }
        html += `<span class="song-list__cell song-list__cell--duration">${song.duration}</span>`;
        html += '</div>';
      });
      
      songRows.innerHTML = html;
    }

    // 切换主题
    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      // 更新按钮状态
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.classList.toggle('switcher__btn--active', btn.dataset.theme === theme);
      });
    }

    // 切换列表状态
    function setState(state) {
      const showAlbum = state === 'B';
      const songs = showAlbum ? songsB : songsA;
      
      // 更新标题和按钮
      document.getElementById('pageTitle').textContent = showAlbum ? '搜索' : '最近播放';
      document.getElementById('pageCount').textContent = showAlbum ? 'Wuthering Waves' : '20 首';
      document.getElementById('pageActions').innerHTML = showAlbum ? '<button class="content__btn">选择文件夹</button>' : '';
      
      // 渲染歌曲
      renderSongs(songs, showAlbum);
      
      // 更新按钮状态
      document.querySelectorAll('[data-state]').forEach(btn => {
        btn.classList.toggle('switcher__btn--active', btn.dataset.state === state);
      });
    }

    // 绑定事件
    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    document.querySelectorAll('[data-state]').forEach(btn => {
      btn.addEventListener('click', () => setState(btn.dataset.state));
    });

    // 初始化
    renderSongs(songsA, false);
  </script>
